       body{

       .container{

       .card{

         width: 380px;

        display: inline-block;
        margin: 15px;

        border-radius: 5px;
        box-shadow: 0 4px 8px black;
        transition: 1s;
       }
       .card:hover{
        box-shadow: 0 15px 80px black;
         width: 480px;
        height: 340px;
       }
       img{
        width: 100%;
        height: 100%;
        border-radius: 5px 5px 0 0;
       }
